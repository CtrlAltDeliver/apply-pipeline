# Target companies for the discovery engine.
# Each entry maps a company to its ATS + slug for the public JSON endpoint.
# Edit this list freely — add the companies you care about, remove the rest.
#
# ATS endpoint patterns (discover.py builds these from the entry fields):
#   greenhouse      → boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   lever           → api.lever.co/v0/postings/<slug>?mode=json
#   ashby           → api.ashbyhq.com/posting-api/job-board/<slug>
#   smartrecruiters → api.smartrecruiters.com/v1/companies/<slug>/postings (paginated)
#   workday         → POST <tenant>.<wd_host>.myworkdayjobs.com/wday/cxs/<tenant>/<board>/jobs
#                     requires extra fields: tenant, wd_host, board
#   hibob           → <slug>.careers.hibob.com/api/job-ad  (slug = careers subdomain)
#                     Cloudflare-gated: discover.py GETs /jobs first for the
#                     __cf_bm cookie, then the JSON. Still no login, no API key.
#
# Status legend:
#   verified — slug confirmed live with N jobs as of last probe (see job_count)
#   todo     — company uses an ATS with no clean public JSON API or hasn't been
#              probed yet. Manual notes on the careers URL included.
#
# Last verified: 2026-06-21

